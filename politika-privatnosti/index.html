<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница переехала — «Не пиши голосовое!»</title>

<!--
  Страница жила по этому адресу меньше суток и успела уйти в Яндекс и Bing
  через IndexNow. GitHub Pages не умеет серверные 301, поэтому переадресация
  собрана разметкой: canonical склеивает старый адрес с новым и передаёт
  накопленные сигналы, meta refresh уводит живого посетителя.

  noindex здесь ставить нельзя: он говорит «выбрось страницу», а canonical —
  «считай её той же, что и новая». Вместе они противоречат друг другу, и
  переезд не засчитается.
-->
<link rel="canonical" href="https://negolosom.ru/policy/">
<meta http-equiv="refresh" content="0; url=/policy/">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 12px;
    padding: 24px;
    background: #EEEBE4;
    color: #1E1E1E;
    font: 400 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  a { color: #1B6B4A; }
</style>
</head>
<body>
  <p>Страница переехала на новый адрес.</p>
  <p><a href="/policy/">Политика конфиденциальности</a></p>
</body>
</html>
